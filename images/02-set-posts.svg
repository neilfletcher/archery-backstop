<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222">
<defs>
<marker id="d" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,5 L9,5 M5,1 L5,9" stroke="#555" stroke-width="1.2"/></marker>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666"/></marker>
<pattern id="gr" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8cfbd"/><circle cx="3" cy="3" r="1.6" fill="#a89c84"/><circle cx="8" cy="7" r="1.3" fill="#a89c84"/></pattern>
<pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdf1ec"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e7b3a4" stroke-width="3"/></pattern>
</defs>
<rect width="900" height="590" fill="#fbfaf7"/>
<text x="24" y="36" font-size="20" font-weight="bold">Day 1, steps 5 to 14: dig and set each post</text>
<text x="24" y="58" text-anchor="start" font-size="13" fill="#666">Side section through one post. Scale approx. 1m = 150px.</text>
<rect x="60" y="400" width="780" height="170" fill="#e8dcc6"/>
<line x1="60" y1="400" x2="840" y2="400" stroke="#6b5a3c" stroke-width="2"/>
<rect x="377" y="400" width="45" height="135" fill="#bcb6a6"/>
<rect x="377" y="407.5" width="45" height="112.5" fill="#cfcfcf" stroke="#888"/>
<rect x="377" y="520" width="45" height="15" fill="url(#gr)" stroke="#888"/>
<rect x="390" y="70" width="19" height="450" fill="#c99b62" stroke="#6e4f2c" stroke-width="1.5"/>
<line x1="392" y1="210" x2="250" y2="400" stroke="#a88a64" stroke-width="7"/>
<rect x="244" y="396" width="10" height="40" fill="#6e4f2c"/>
<text x="236" y="360" text-anchor="end" font-size="13" fill="#333">temporary prop</text>
<text x="236" y="376" text-anchor="end" font-size="13" fill="#333">to a peg (one on</text>
<text x="236" y="392" text-anchor="end" font-size="13" fill="#333">two adjacent faces)</text>
<rect x="411" y="140" width="9" height="130" fill="#f2c94c" stroke="#8a6d12"/>
<ellipse cx="415.5" cy="205" rx="3" ry="9" fill="#9bd08a" stroke="#4e7d40"/>
<polyline points="421,200 470,170 480,170" fill="none" stroke="#777" stroke-width="1"/><text x="484" y="174" text-anchor="start" font-size="13" fill="#333">spirit level: check front face AND side face</text>
<line x1="330" y1="70" x2="330" y2="400" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/>
<text x="322" y="240" text-anchor="middle" font-size="14" transform="rotate(-90 322 240)">2.2m above ground</text>
<line x1="470" y1="400" x2="470" y2="520" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="478" y="464" text-anchor="start" font-size="13" fill="#333">0.8m of post in the ground</text>
<polyline points="422,528 470,550 480,550" fill="none" stroke="#777" stroke-width="1"/><text x="484" y="554" text-anchor="start" font-size="13" fill="#333">100mm gravel, pressed down</text>
<polyline points="422,404 560,360 570,360" fill="none" stroke="#777" stroke-width="1"/><text x="574" y="364" text-anchor="start" font-size="13" fill="#333">Postcrete stops 50mm below ground;</text>
<text x="574" y="380" text-anchor="start" font-size="13" fill="#333">top up with soil later</text>
<line x1="377" y1="550" x2="422" y2="550" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="399.5" y="566" text-anchor="middle" font-size="13" fill="#333">300mm</text>
<polyline points="409,100 470,100 480,100" fill="none" stroke="#777" stroke-width="1"/><text x="484" y="104" text-anchor="start" font-size="13" fill="#333">125x125mm x 3.0m post, tops level with the other post</text>
<rect x="640" y="220" width="190" height="130" fill="#fff" stroke="#ccc"/>
<text x="650" y="240" text-anchor="start" font-size="13" fill="#333" font-weight="bold">From above:</text>
<rect x="715" y="265" width="40" height="40" fill="#c99b62" stroke="#6e4f2c" stroke-width="1.5"/>
<rect x="712" y="310" width="46" height="7" fill="#f2c94c" stroke="#8a6d12"/>
<rect x="760" y="262" width="7" height="46" fill="#f2c94c" stroke="#8a6d12"/>
<text x="735" y="338" text-anchor="middle" font-size="12" fill="#333">level on 2 faces</text>
</svg>