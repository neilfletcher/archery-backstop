<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#222">
<defs>
<marker id="d" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,5 L9,5 M5,1 L5,9" stroke="#555" stroke-width="1.2"/></marker>
<marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker>
<marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#666"/></marker>
<pattern id="gr" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#d8cfbd"/><circle cx="3" cy="3" r="1.6" fill="#a89c84"/><circle cx="8" cy="7" r="1.3" fill="#a89c84"/></pattern>
<pattern id="hz" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#fdf1ec"/><line x1="0" y1="0" x2="0" y2="12" stroke="#e7b3a4" stroke-width="3"/></pattern>
</defs>
<rect width="900" height="620" fill="#fbfaf7"/>
<text x="24" y="36" font-size="20" font-weight="bold">Preparing the mats, steps 1 to 3: cut mat C</text>
<text x="24" y="58" text-anchor="start" font-size="13" fill="#666">Mat C from above. Scale approx. 1m = 300px. Dashed red lines are cuts, in order 1, 2, 3.</text>
<rect x="150" y="110" width="549.0" height="366.0" fill="#2e3336" stroke="#15181a"/>
<line x1="150" y1="293.0" x2="699.0" y2="293.0" stroke="#ff6b5a" stroke-width="3" stroke-dasharray="10 6"/>
<line x1="630.0" y1="110" x2="630.0" y2="293.0" stroke="#ff6b5a" stroke-width="3" stroke-dasharray="10 6"/>
<line x1="150" y1="384.5" x2="699.0" y2="384.5" stroke="#ff6b5a" stroke-width="3" stroke-dasharray="10 6"/>
<circle cx="130" cy="293.0" r="14" fill="#b03a2e"/><text x="130" y="298.0" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1</text><circle cx="630.0" cy="92" r="14" fill="#b03a2e"/><text x="630.0" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">2</text><circle cx="130" cy="384.5" r="14" fill="#b03a2e"/><text x="130" y="389.5" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">3</text>
<text x="390.0" y="207.5" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">C1: rear strip, 1.60 x 0.61m</text>
<text x="664.5" y="207.5" text-anchor="middle" font-size="13" fill="#ddd">offcut</text>
<text x="424.5" y="344.75" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">C2: low strip piece, 1.83 x 0.305m</text>
<text x="424.5" y="436.25" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">C2: low strip piece, 1.83 x 0.305m (trim on site)</text>
<line x1="150" y1="502.0" x2="699.0" y2="502.0" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="424.5" y="522.0" text-anchor="middle" font-size="14" fill="#333">1.83m</text>
<line x1="725.0" y1="110" x2="725.0" y2="293.0" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="733.0" y="206.5" text-anchor="start" font-size="14" fill="#333">0.61m</text>
<line x1="725.0" y1="293.0" x2="725.0" y2="384.5" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="733.0" y="343.75" text-anchor="start" font-size="14" fill="#333">0.305m</text>
<line x1="725.0" y1="384.5" x2="725.0" y2="476.0" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="733.0" y="435.25" text-anchor="start" font-size="14" fill="#333">0.305m</text>
<line x1="630.0" y1="70" x2="699.0" y2="70" stroke="#555" stroke-width="1.2" marker-start="url(#d)" marker-end="url(#d)"/><text x="664.5" y="62" text-anchor="middle" font-size="13" fill="#333">0.23m</text>
<text x="24" y="566.0" text-anchor="start" font-size="14" fill="#333" font-weight="bold">How to cut:</text>
<text x="24" y="588.0" text-anchor="start" font-size="13" fill="#333">Kneel on a straightedge along the chalk line. Make 4 to 6 firm passes with the knife, cutting away from you.</text>
<text x="24" y="608.0" text-anchor="start" font-size="13" fill="#333">After two passes, fold the rubber back along the cut so it opens up and the blade runs through easily.</text>
</svg>