<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect y="90" width="1100" height="560" fill="#f7f5f0"/>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b03a2e"/></marker>
    <marker id="dm" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,4 L8,4 M4,0 L4,8" stroke="#555" stroke-width="1"/></marker>
  </defs>

  <text x="40" y="130" font-size="20" font-weight="bold" fill="#222">Hanging rubber mat backstop for a 60cm target (3 mats, low stop, no struts)</text>
  <text x="40" y="152" fill="#555">Scale approx. 100px = 1m. Two 6ft x 4ft x 17mm stable mats side by side, plus a half-mat strip hung behind the centre join.</text>

  <!-- ===== FRONT VIEW ===== -->
  <text x="130" y="215" font-size="15" font-weight="bold" fill="#222">FRONT VIEW (from the shooting line)</text>
  <rect x="60" y="480" width="440" height="100" fill="#e3d8c3"/>
  <line x1="60" y1="480" x2="500" y2="480" stroke="#6b5a3c" stroke-width="2"/>
  <rect x="135" y="480" width="30" height="80" fill="#c4c4c4" stroke="#888" stroke-dasharray="4 3"/>
  <rect x="395" y="480" width="30" height="80" fill="#c4c4c4" stroke="#888" stroke-dasharray="4 3"/>
  <rect x="143" y="260" width="12" height="300" fill="#a0784a" stroke="#6e4f2c"/>
  <rect x="405" y="260" width="12" height="300" fill="#a0784a" stroke="#6e4f2c"/>
  <rect x="130" y="253" width="300" height="7" fill="#8a6a42"/>
  <rect x="130" y="260" width="300" height="15" fill="#b98c58" stroke="#6e4f2c"/>
  <g stroke="#c9b27a" stroke-width="2">
    <line x1="173" y1="275" x2="173" y2="280"/><line x1="265" y1="275" x2="265" y2="280"/>
    <line x1="295" y1="275" x2="295" y2="280"/><line x1="387" y1="275" x2="387" y2="280"/>
  </g>
  <rect x="155" y="450" width="250" height="30" fill="#4a5054" stroke="#15181a"/><rect x="158" y="280" width="122" height="183" fill="#2e3336" stroke="#15181a"/>
  <rect x="280" y="280" width="122" height="183" fill="#33393c" stroke="#15181a"/>
  <g fill="#8a6a42"><rect x="158" y="280" width="122" height="5"/><rect x="280" y="280" width="122" height="5"/></g>
  <rect x="250" y="286" width="61" height="157" fill="none" stroke="#e0a030" stroke-width="1.8" stroke-dasharray="6 4"/>
  <g stroke="#6e4f2c" stroke-width="4"><line x1="255" y1="388" x2="236" y2="480"/><line x1="305" y1="388" x2="324" y2="480"/></g>
  <rect x="240" y="310" width="80" height="80" fill="#d6c395" stroke="#9c8656"/>
  <circle cx="280" cy="350" r="30" fill="#ffffff" stroke="#999"/>
  <circle cx="280" cy="350" r="24" fill="#222"/>
  <circle cx="280" cy="350" r="18" fill="#3a8fd0"/>
  <circle cx="280" cy="350" r="12" fill="#d9362b"/>
  <circle cx="280" cy="350" r="6" fill="#f5d22a"/>
  <line x1="158" y1="505" x2="402" y2="505" stroke="#555" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="280" y="522" text-anchor="middle" fill="#333">2.44m of mat</text>
  <line x1="150" y1="540" x2="410" y2="540" stroke="#555" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="280" y="557" text-anchor="middle" fill="#333">posts 2.6m apart (centres)</text>
  <line x1="105" y1="260" x2="105" y2="480" stroke="#555" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="97" y="370" text-anchor="middle" fill="#333" transform="rotate(-90 97 370)">2.2m</text>
  <line x1="450" y1="280" x2="450" y2="463" stroke="#555" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="456" y="375" fill="#333">1.83m</text>
  <text x="456" y="476" fill="#333" font-size="11">fixed low strip 0 to 0.3m</text>
  <line x1="60" y1="606" x2="90" y2="606" stroke="#e0a030" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="98" y="610" fill="#333">half-mat strip (1.83 x 0.61m) hung behind the centre join</text>
  <text x="60" y="630" fill="#333">60cm face on an 80cm boss, centre 1.3m. Mat top 2.0m, 40cm above the face.</text>

  <!-- ===== SIDE SECTION ===== -->
  <text x="620" y="215" font-size="15" font-weight="bold" fill="#222">SIDE SECTION</text>
  <rect x="590" y="480" width="480" height="100" fill="#e3d8c3"/>
  <line x1="590" y1="480" x2="1070" y2="480" stroke="#6b5a3c" stroke-width="2"/>
  <rect x="735" y="480" width="40" height="80" fill="#c4c4c4" stroke="#888"/>
  
  
  <rect x="750" y="260" width="10" height="300" fill="#a0784a" stroke="#6e4f2c"/>
  <rect x="743" y="260" width="7" height="15" fill="#b98c58" stroke="#6e4f2c"/>
  <rect x="760" y="260" width="7" height="15" fill="#b98c58" stroke="#6e4f2c"/>
  <rect x="738" y="253" width="34" height="7" fill="#8a6a42"/>
  <line x1="746" y1="275" x2="746" y2="280" stroke="#c9b27a" stroke-width="2"/>
  <line x1="764" y1="275" x2="764" y2="280" stroke="#c9b27a" stroke-width="2"/>
  <rect x="744" y="280" width="4" height="183" fill="#2e3336"/>
  <rect x="762" y="286" width="4" height="157" fill="#2e3336"/><rect x="760" y="450" width="6" height="30" fill="#b98c58" stroke="#6e4f2c"/><line x1="760" y1="465" x2="766" y2="465" stroke="#6e4f2c"/><rect x="756" y="450" width="3" height="30" fill="#4a5054"/>
  <polygon points="651,310 671,311 667,390 647,389" fill="#d6c395" stroke="#9c8656"/>
  <line x1="650" y1="320" x2="648" y2="380" stroke="#d9362b" stroke-width="3"/>
  <g stroke="#6e4f2c" stroke-width="4"><line x1="657" y1="385" x2="640" y2="480"/><line x1="665" y1="385" x2="695" y2="480"/></g>
  <line x1="600" y1="350" x2="640" y2="350" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="598" y="340" fill="#b03a2e" font-size="12">shooting</text>
  <line x1="669" y1="455" x2="744" y2="455" stroke="#555" marker-start="url(#dm)" marker-end="url(#dm)"/>
  <text x="706" y="449" text-anchor="middle" fill="#333" font-size="11">0.75m</text>
  <g stroke="#777" stroke-width="1" fill="none">
    <polyline points="772,256 820,235 830,235"/>
    <polyline points="767,268 820,262 830,262"/>
    <polyline points="766,300 820,292 830,292"/>
    <polyline points="746,300 720,262 700,262"/>
    <polyline points="756,380 820,352 830,352"/>
    <polyline points="766,462 820,420 830,420"/>
  </g>
  <text x="834" y="239" fill="#333">top cover board over both rails</text>
  <text x="834" y="266" fill="#333">front and rear 47x150mm rails</text>
  <text x="834" y="296" fill="#333">half-mat strip behind join (trimmed to 1.6m)</text>
  <text x="628" y="258" fill="#333">front mats</text>
  <text x="834" y="356" fill="#333">approx. 150mm air gap</text>
  <text x="834" y="416" fill="#333">2 x 150mm boards on rear of posts,</text><text x="834" y="432" fill="#333">mat strip screwed to front face</text>
  <text x="600" y="610" fill="#333">125x125mm x 3.0m post: 2.2m above ground, 0.8m in concrete. No struts.</text>
  <text x="600" y="630" fill="#333">Mats hang on rope from eye screws so they swing and absorb energy.</text>
</svg>
